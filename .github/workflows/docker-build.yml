name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v1.0.0, v2.1.3, etc.
  pull_request:  # Test job only; the build job is gated to tags/dispatch below
  workflow_dispatch:  # Allows manual triggering

env:
  DOCKER_HUB_USERNAME: qodexai
  IMAGE_NAME: apimesh

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    # Pull requests only run the test job; images are built on tags/dispatch.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tag_version
        env:
          IMAGE: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          REF_NAME: ${{ github.ref_name }}
          IS_VERSION_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [[ "$IS_VERSION_TAG" == "true" ]]; then
            # Real version tag: publish the version and move :latest onto it.
            TAGS="$IMAGE:$REF_NAME"$'\n'"$IMAGE:latest"
          else
            # Manual dispatch: dev tag only, so :latest keeps pointing at the last release.
            TAGS="$IMAGE:dev"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.tag_version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: |
          echo "Image pushed with tags:"
          echo "${{ steps.tag_version.outputs.tags }}"
